version: 1
project:
  name: docker-wagtail-develop
  description: >
    Narrow pressure slice for Wagtail's documented Docker Compose development flow, including the
    dedicated Postgres volume destroy path.
execution:
  default_context: host
  contexts:
    host:
      backend: native
      requirements:
        tools:
          docker: "*"
surfaces:
  site:
    kind: http
    port: 8000
    path: /
services:
  web:
    manager:
      kind: compose
      name: docker-wagtail-develop
      file: compose.yaml
      service: web
    endpoints:
      host:
        address: 127.0.0.1
        port: 8000
    readiness:
      kind: tcp
      from: host
  db:
    manager:
      kind: compose
      name: docker-wagtail-develop
      file: compose.yaml
      service: db
  elastic:
    manager:
      kind: compose
      name: docker-wagtail-develop
      file: compose.yaml
      service: elastic
    endpoints:
      host:
        address: 127.0.0.1
        port: 9200
    readiness:
      kind: tcp
      from: host
tasks:
  bootstrap:
    context: host
    description: Materialize the documented Wagtail development checkout layout
    notes: >
      Mirrors the README setup step `./setup.sh`, which clones `bakerydemo`, `wagtail`, and the
      supporting libraries before Compose startup can work on a fresh checkout, then materializes
      the documented Bakerydemo local settings and `.env` files when missing.
    action:
      kind: ensure_bundle
      steps:
        - kind: ensure_git_checkout
          path: bakerydemo
          source:
            git: https://github.com/wagtail/bakerydemo.git
            ref: 51a8b92edaffc64ff050abdd95bed87c55d550c6
        - kind: ensure_git_checkout
          path: wagtail
          source:
            git: https://github.com/wagtail/wagtail.git
            ref: ed49bf54e3cd0cda0793cdba4301bf228a5373c9
        - kind: ensure_directory
          path: libs
        - kind: ensure_git_checkout
          path: libs/django-modelcluster
          source:
            git: https://github.com/wagtail/django-modelcluster.git
            ref: fef1604656d9c146077958e32a86cd8138ee30de
        - kind: ensure_git_checkout
          path: libs/Willow
          source:
            git: https://github.com/wagtail/Willow.git
            ref: 34de53c6fc30e3384b5a8d60db8a4e71e58eb7a0
        - kind: copy_if_missing
          from: bakerydemo/bakerydemo/settings/local.py.example
          to: bakerydemo/bakerydemo/settings/local.py
        - kind: ensure_file
          path: bakerydemo/.env
          value: |
            DJANGO_SETTINGS_MODULE=bakerydemo.settings.dev
    effects:
      writes:
        - bakerydemo
        - wagtail
        - libs
      external_state:
        - git
    safe_for_agent: false
  images:build:
    context: host
    description: Build the documented Wagtail development Compose images
    notes: Mirrors the README setup step `docker compose build`.
    adapter_inputs:
      overlays:
        compose:
          files:
            - compose.yaml
          project_name: docker-wagtail-develop
    compose:
      kind: build
    depends_on:
      - bootstrap
    requirements:
      tools:
        docker: "*"
    effects:
      external_state:
        - docker
    safe_for_agent: false
  web:up:
    context: host
    description: Start the documented Wagtail development containers
    notes: Mirrors the README path `docker compose up web`.
    adapter_inputs:
      overlays:
        compose:
          files:
            - compose.yaml
          project_name: docker-wagtail-develop
    launch:
      kind: compose
      action: up
      services:
        - web
    variants:
      - when:
          os: linux
        env:
          CURRENT_UID: ${OTA_HOST_UID}:${OTA_HOST_GID}
        adapter_inputs:
          overlays:
            compose:
              files:
                - compose.linux.yaml
    depends_on:
      - images:build
    requirements:
      tools:
        docker: "*"
    effects:
      external_state:
        - docker
        - postgres
    runtime:
      kind: service
      surfaces:
        - site
      readiness:
        kind: tcp
        listener: http
        interval: 5s
        timeout: 3s
        retries: 20
        start_period: 5s
      listeners:
        http:
          protocol: http
          bind:
            address: 0.0.0.0
            port:
              mode: fixed
              value: 8000
          project:
            host:
              address: 127.0.0.1
              primary: true
              port:
                mode: fixed
                value: 8000
              path: /
  web:up:elastic:
    context: host
    description: Start the documented Wagtail and Elasticsearch development stack
    notes: >
      Mirrors the README path `docker compose up web elastic` for search-backend development.
      Additional Wagtail search-backend dependency installation and configuration still belong to
      the Wagtail repo and are not claimed as ready by this contract.
    adapter_inputs:
      overlays:
        compose:
          files:
            - compose.yaml
          project_name: docker-wagtail-develop
    launch:
      kind: compose
      action: up
      services:
        - web
        - elastic
    variants:
      - when:
          os: linux
        env:
          CURRENT_UID: ${OTA_HOST_UID}:${OTA_HOST_GID}
        adapter_inputs:
          overlays:
            compose:
              files:
                - compose.linux.yaml
    depends_on:
      - images:build
    requirements:
      tools:
        docker: "*"
    effects:
      external_state:
        - docker
        - postgres
        - elasticsearch
    runtime:
      kind: service
      surfaces:
        - site
      readiness:
        kind: tcp
        listener: http
        interval: 5s
        timeout: 3s
        retries: 20
        start_period: 5s
      listeners:
        http:
          protocol: http
          bind:
            address: 0.0.0.0
            port:
              mode: fixed
              value: 8000
          project:
            host:
              address: 127.0.0.1
              primary: true
              port:
                mode: fixed
                value: 8000
              path: /
  db:migrate:
    context: host
    description: Run the documented Django migrations inside the running web service
    notes: Mirrors `docker compose exec web python manage.py migrate --noinput`.
    adapter_inputs:
      overlays:
        compose:
          files:
            - compose.yaml
          project_name: docker-wagtail-develop
    compose:
      kind: exec
      service: web
      exe: python
      args:
        - manage.py
        - migrate
        - --noinput
    depends_on:
      - web:up
    requirements:
      tools:
        docker: "*"
    after_success:
      - db:load-initial-data
    effects:
      writes:
        - bakerydemo
      external_state:
        - docker
        - postgres
    safe_for_agent: false
  db:load-initial-data:
    context: host
    description: Load the documented initial Bakerydemo data inside the running web service
    notes: Mirrors `docker compose exec web python manage.py load_initial_data`.
    adapter_inputs:
      overlays:
        compose:
          files:
            - compose.yaml
          project_name: docker-wagtail-develop
    compose:
      kind: exec
      service: web
      exe: python
      args:
        - manage.py
        - load_initial_data
    depends_on:
      - web:up
    requirements:
      tools:
        docker: "*"
    after_success:
      - search:update-index
    effects:
      writes:
        - bakerydemo
      external_state:
        - docker
        - postgres
    safe_for_agent: false
  search:update-index:
    context: host
    description: Update the documented search index inside the running web service
    notes: Mirrors `docker compose exec web python manage.py update_index`.
    adapter_inputs:
      overlays:
        compose:
          files:
            - compose.yaml
          project_name: docker-wagtail-develop
    compose:
      kind: exec
      service: web
      exe: python
      args:
        - manage.py
        - update_index
    depends_on:
      - web:up
    requirements:
      tools:
        docker: "*"
    effects:
      writes:
        - bakerydemo
      external_state:
        - docker
        - postgres
    safe_for_agent: false
  db:setup:
    description: Run the documented database setup script
    notes: >
      Mirrors the README setup step `./setup-db.sh`, which initializes the persisted Docker volume
      on first startup through migrate, initial-data, and index-update phases inside the running
      web service.
    aggregate:
      tasks:
        - db:migrate
        - db:load-initial-data
        - search:update-index
    safe_for_agent: false
  web:stop:
    context: host
    description: Stop the documented Docker Compose services
    notes: Mirrors `docker compose stop`.
    adapter_inputs:
      overlays:
        compose:
          files:
            - compose.yaml
          project_name: docker-wagtail-develop
    compose:
      kind: stop
    requirements:
      tools:
        docker: "*"
    effects:
      external_state:
        - docker
        - postgres
    safe_for_agent: false
  web:down:
    context: host
    description: Stop and remove the documented Docker Compose services
    notes: Mirrors `docker compose down`.
    adapter_inputs:
      overlays:
        compose:
          files:
            - compose.yaml
          project_name: docker-wagtail-develop
    compose:
      kind: down
    requirements:
      tools:
        docker: "*"
    effects:
      external_state:
        - docker
        - postgres
    safe_for_agent: false
  test:
    context: host
    description: Run the documented Wagtail test suite inside the running web service
    notes: Mirrors `docker compose exec -w /code/wagtail web python runtests.py`.
    adapter_inputs:
      overlays:
        compose:
          files:
            - compose.yaml
          project_name: docker-wagtail-develop
    compose:
      kind: exec
      service: web
      workdir: /code/wagtail
      exe: python
      args:
        - runtests.py
    depends_on:
      - web:up
    requirements:
      tools:
        docker: "*"
    effects:
      external_state:
        - docker
        - postgres
    safe_for_agent: false
  migrations:make:
    context: host
    description: Make Django migrations inside the running web service
    notes: Mirrors `docker compose exec web python manage.py makemigrations`.
    adapter_inputs:
      overlays:
        compose:
          files:
            - compose.yaml
          project_name: docker-wagtail-develop
    compose:
      kind: exec
      service: web
      exe: python
      args:
        - manage.py
        - makemigrations
    depends_on:
      - web:up
    requirements:
      tools:
        docker: "*"
    effects:
      writes:
        - bakerydemo
        - wagtail
      external_state:
        - docker
        - postgres
    safe_for_agent: false
  lint:wagtail:
    description: Run the documented Wagtail lint surfaces inside the running services
    notes: >
      Mirrors the README lint path `make lint-wagtail`, which runs `make lint-server`,
      `make lint-docs`, and `make lint-client` through the Compose services.
    aggregate:
      tasks:
        - lint:wagtail:server
        - lint:wagtail:docs
        - lint:wagtail:client
    safe_for_agent: false
  lint:wagtail:server:
    context: host
    description: Run Wagtail server lint inside the running web service
    notes: Mirrors `docker compose exec -w /code/wagtail web make lint-server`.
    adapter_inputs:
      overlays:
        compose:
          files:
            - compose.yaml
          project_name: docker-wagtail-develop
    compose:
      kind: exec
      service: web
      workdir: /code/wagtail
      exe: make
      args:
        - lint-server
    depends_on:
      - web:up
    requirements:
      tools:
        docker: "*"
    effects:
      external_state:
        - docker
        - postgres
    safe_for_agent: false
  lint:wagtail:docs:
    context: host
    description: Run Wagtail docs lint inside the running web service
    notes: Mirrors `docker compose exec -w /code/wagtail web make lint-docs`.
    adapter_inputs:
      overlays:
        compose:
          files:
            - compose.yaml
          project_name: docker-wagtail-develop
    compose:
      kind: exec
      service: web
      workdir: /code/wagtail
      exe: make
      args:
        - lint-docs
    depends_on:
      - web:up
    requirements:
      tools:
        docker: "*"
    effects:
      external_state:
        - docker
        - postgres
    safe_for_agent: false
  lint:wagtail:client:
    context: host
    description: Run Wagtail client lint inside the running frontend service
    notes: Mirrors `docker compose exec frontend make lint-client`.
    adapter_inputs:
      overlays:
        compose:
          files:
            - compose.yaml
          project_name: docker-wagtail-develop
    compose:
      kind: exec
      service: frontend
      exe: make
      args:
        - lint-client
    depends_on:
      - web:up
    requirements:
      tools:
        docker: "*"
    effects:
      external_state:
        - docker
    safe_for_agent: false
  format:wagtail:
    description: Run the documented Wagtail format surfaces inside the running services
    notes: >
      Mirrors the README format path `make format-wagtail`, which runs `make format-server`
      and `make format-client` through the Compose services.
    aggregate:
      tasks:
        - format:wagtail:server
        - format:wagtail:client
    safe_for_agent: false
  format:wagtail:server:
    context: host
    description: Run Wagtail server format inside the running web service
    notes: Mirrors `docker compose exec -w /code/wagtail web make format-server`.
    adapter_inputs:
      overlays:
        compose:
          files:
            - compose.yaml
          project_name: docker-wagtail-develop
    compose:
      kind: exec
      service: web
      workdir: /code/wagtail
      exe: make
      args:
        - format-server
    depends_on:
      - web:up
    requirements:
      tools:
        docker: "*"
    effects:
      writes:
        - wagtail
      external_state:
        - docker
        - postgres
    safe_for_agent: false
  format:wagtail:client:
    context: host
    description: Run Wagtail client format inside the running frontend service
    notes: Mirrors `docker compose exec frontend make format-client`.
    adapter_inputs:
      overlays:
        compose:
          files:
            - compose.yaml
          project_name: docker-wagtail-develop
    compose:
      kind: exec
      service: frontend
      exe: make
      args:
        - format-client
    depends_on:
      - web:up
    requirements:
      tools:
        docker: "*"
    effects:
      writes:
        - wagtail
      external_state:
        - docker
    safe_for_agent: false
  shell:django:
    context: host
    description: Open the documented Django shell inside the running web service
    notes: Mirrors `docker compose exec web python manage.py shell`.
    adapter_inputs:
      overlays:
        compose:
          files:
            - compose.yaml
          project_name: docker-wagtail-develop
    compose:
      kind: exec
      service: web
      exe: python
      args:
        - manage.py
        - shell
      tty: true
    depends_on:
      - web:up
    requirements:
      tools:
        docker: "*"
    effects:
      external_state:
        - docker
        - postgres
    safe_for_agent: false
  shell:db:
    context: host
    description: Open the documented PostgreSQL shell inside the running web service
    notes: Mirrors `docker compose exec web python manage.py dbshell`.
    adapter_inputs:
      overlays:
        compose:
          files:
            - compose.yaml
          project_name: docker-wagtail-develop
    compose:
      kind: exec
      service: web
      exe: python
      args:
        - manage.py
        - dbshell
      tty: true
    depends_on:
      - web:up
    requirements:
      tools:
        docker: "*"
    effects:
      external_state:
        - docker
        - postgres
    safe_for_agent: false
  shell:web:
    context: host
    description: Open the documented shell on the running web service
    notes: Mirrors `docker compose exec web bash`.
    adapter_inputs:
      overlays:
        compose:
          files:
            - compose.yaml
          project_name: docker-wagtail-develop
    compose:
      kind: exec
      service: web
      exe: bash
      tty: true
    depends_on:
      - web:up
    requirements:
      tools:
        docker: "*"
    effects:
      external_state:
        - docker
        - postgres
    safe_for_agent: false
  shell:wagtail:
    context: host
    description: Open the documented shell in the Wagtail workdir inside the running web service
    notes: Mirrors `docker compose exec -w /code/wagtail web bash`.
    adapter_inputs:
      overlays:
        compose:
          files:
            - compose.yaml
          project_name: docker-wagtail-develop
    compose:
      kind: exec
      service: web
      workdir: /code/wagtail
      exe: bash
      tty: true
    depends_on:
      - web:up
    requirements:
      tools:
        docker: "*"
    effects:
      external_state:
        - docker
        - postgres
    safe_for_agent: false
  shell:frontend:
    context: host
    description: Open the documented shell on the running frontend service
    notes: Mirrors `docker compose exec frontend bash`.
    adapter_inputs:
      overlays:
        compose:
          files:
            - compose.yaml
          project_name: docker-wagtail-develop
    compose:
      kind: exec
      service: frontend
      exe: bash
      tty: true
    depends_on:
      - web:up
    requirements:
      tools:
        docker: "*"
    effects:
      external_state:
        - docker
    safe_for_agent: false
  db:destroy:
    context: host
    description: Remove the documented Postgres Docker volume and restart the Compose service
    notes: >
      Mirrors the dedicated `make destroy-db` surface, which removes the
      `docker-wagtail-develop_postgres-data` volume owned by the `db` Compose service.
    action:
      kind: reset_compose_service_volume
      service: db
      volume: docker-wagtail-develop_postgres-data
      compose:
        files:
          - compose.yaml
        project_name: docker-wagtail-develop
    requirements:
      tools:
        docker: "*"
    effects:
      adapter_state:
        - compose_volume:postgres-data
      external_state:
        - docker
        - postgres
    safe_for_agent: false
workflows:
  default: local-dev
  local-dev:
    intent: local_development
    description: >
      Documented Docker Compose setup path for local Wagtail development, including bootstrap,
      container startup, and database initialization.
    prepare:
      task: db:migrate
agent:
  posture: readiness_strict
  entrypoint: bootstrap
  default_task: web:up
  protected_paths:
    - .github/workflows
    - compose.yaml
    - Dockerfile
    - ota.yaml
  bootstrap:
    ota:
      note: Install ota only when missing so contributors and agents can use the readiness workflows declared here.
      source:
        kind: git_rev
        rev: fe72b8079451fb09b7336e26948b4ac4f83bad86
  notes: |
    This contract intentionally scopes docker-wagtail-develop to the documented Compose development bootstrap,
    container startup, and database initialization flow.
    Review `ota tasks --use` before execution; the modeled tasks clone repos or mutate Docker and database state
    and are not declared agent-safe by default.
    Use `ota up --workflow local-dev` for the documented setup path.
metadata:
  ota:
    minimum_version: "1.6.22"
